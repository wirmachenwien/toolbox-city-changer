name: Toolchain setup
description: Shared Node, Python and PDF toolchain for CI and deploy jobs

runs:
  using: composite
  steps:
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install PDF system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libharfbuzz-subset0 libjpeg-dev libopenjp2-7-dev libffi-dev
      shell: bash

    - name: Install PDF dependencies
      run: pip install -r requirements.txt
      shell: bash
