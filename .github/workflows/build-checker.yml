name: Check build
on:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                fetch-depth: 2

            - name: Set up Ruby 3.2.5
              uses: ruby/setup-ruby@v1
              with:
                ruby-version: 3.2.5

            - name: Install Bundler 2.5.16
              run: gem install bundler -v 2.5.16

            - name: Bundle install
              run: bundle install

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install web build dependencies
              run: |
                npm ci --ignore-scripts
                node node_modules/@electricbookworks/electric-book-modules/install.js

            - name: Build JavaScript
              run: output=web npx webpack --config _webpack/webpack.config.js --mode production

            - name: Build with Jekyll
              run: |
                bundle exec jekyll build

            - name: Check language versions
              run: |
                python3 _tests/check-translations.py
                node _tests/search-languages.cjs
