name: Check build
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz-subset0 libjpeg-dev libopenjp2-7-dev libffi-dev

      - name: Install PDF dependencies
        run: pip install -r requirements.txt

      - name: Build PDFs
        run: npm run build:pdf

      - name: Check translations and links
        run: npm run check:i18n

      - name: Check for legacy naming baggage
        run: npm run check:baggage

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handbook-pdfs
          path: dist/downloads/
