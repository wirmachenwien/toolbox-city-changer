name: Deploy to GitHub Pages

# Main branch (and manual dispatch) only: build, check and publish.
# Pull-request validation lives in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check derived config files are in sync
        run: npm run check:config

      - name: Build static site, PDFs, EPUBs and search index
        run: npm run build

      - name: Check translations, links, sitemap and search index
        run: npm run check:site

      - name: Check glossary term coverage and dictionary sync
        run: npm run check:glossary

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
