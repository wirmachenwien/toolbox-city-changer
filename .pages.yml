# GENERATED from handbook.config.ts — do not edit by hand.
# Run `npm run sync:config` to regenerate.
media:
  - name: book_images
    label: Book images
    input: src/assets/book
    output: src/assets/book
    categories: [image]
    rename: safe
  - name: site_images
    label: Site images
    input: src/assets/site
    output: src/assets/site
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  markdown_body:
    label: Body
    type: code
    options:
      format: mdx
  book_template:
    label: Template
    type: select
    options:
      values:
        - name: chapter
          label: Chapter
        - name: cover
          label: Cover
        - name: title
          label: Title page
        - name: about
          label: About page
        - name: contents
          label: Contents page
  page_template:
    label: Template
    type: select
    options:
      values:
        - name: home
          label: Home
        - name: page
          label: Content page
        - name: search
          label: Search page
  language:
    label: Language
    type: select
    options:
      values:
        - name: de
          label: "Deutsch"
        - name: en
          label: "English"
        - name: sl
          label: "Slovenščina"

content:
  - name: project_settings
    label: Project Settings
    type: group
    items:
      - name: project_metadata
        label: Project metadata
        type: file
        path: src/data/project.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: creator
            type: string
          - name: contributor
            type: string
          - name: publisher
            type: string
          - name: rights
            type: text
          - name: date
            type: string
          - name: modified
            type: string
          - name: identifier
            type: string

      - name: app_settings
        label: Site and PDF settings
        type: file
        path: src/data/settings.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: downloads
            label: Download settings
            type: object
            fields:
              - name: pdf
                label: Generate PDF downloads
                type: boolean
              - name: epub
                label: Generate EPUB downloads
                type: boolean
          - name: web
            label: Website settings
            type: object
            fields:
              - name: pagination
                type: boolean
              - name: paginationType
                label: Pagination type
                type: select
                options:
                  values:
                    - name: title-arrows
                      label: Title and arrows
                    - name: arrows
                      label: Arrows only
                    - name: titles
                      label: Titles only
                    - name: previous-next
                      label: Previous and next
              - name: collapsibleSections
                label: Collapsible sections
                type: select
                options:
                  values:
                    - name: none
                      label: No automatic collapsing
                    - name: h2
                      label: Collapse H2 sections
                    - name: h3
                      label: Collapse H3 sections
                    - name: h4
                      label: Collapse H4 sections
                    - name: h5
                      label: Collapse H5 sections
              - name: bookmarks
                type: object
                fields:
                  - name: enabled
                    type: boolean
              - name: nav
                label: Navigation behavior
                type: object
                fields:
                  - name: expandBooks
                    type: boolean
                  - name: projectNavPosition
                    type: select
                    options:
                      values:
                        - name: before
                          label: Before book navigation
                        - name: after
                          label: After book navigation
              - name: search
                type: object
                fields:
                  - name: param
                    label: Search query parameter
                    type: string
              - name: titleDivider
                label: Title divider
                type: string
              - name: indexing
                label: Search engine indexing
                type: boolean
          - name: pdf
            label: PDF settings
            type: object
            fields:
              - name: notes
                label: Note placement
                type: select
                options:
                  values:
                    - name: footnotes
                      label: Footnotes, bottom of page
                    - name: chapter-footnotes
                      label: End of chapter
                    - name: book-footnotes
                      label: End of book
              - name: page
                label: Page setup
                type: object
                fields:
                  - name: size
                    type: string
                  - name: margin
                    type: string

