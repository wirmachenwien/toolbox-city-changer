media:
  - name: book_images
    label: Book images
    input: src/assets/book
    output: src/assets/book
    categories: [image]
    rename: safe
  - name: site_images
    label: Site images
    input: src/assets/site
    output: src/assets/site
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  markdown_body:
    label: Body
    type: rich-text
    options:
      format: markdown
      switcher: true
  book_template:
    label: Template
    type: select
    options:
      values:
        - name: chapter
          label: Chapter
        - name: cover
          label: Cover
        - name: title
          label: Title page
        - name: copyright
          label: Copyright page
        - name: contents
          label: Contents page
  page_template:
    label: Template
    type: select
    options:
      values:
        - name: home
          label: Home
        - name: page
          label: Content page
        - name: search
          label: Search page
  language:
    label: Language
    type: select
    options:
      values:
        - name: de
          label: German
        - name: en
          label: English
        - name: sl
          label: Slovene

content:
  - name: handbook
    label: Handbook
    type: group
    items:
      - name: chapters_de
        label: Chapters (German)
        type: collection
        path: src/content/book/de
        format: yaml-frontmatter
        filename:
          template: "{primary}.mdx"
          field: create
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Chapter title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: book_template
          - name: description
            label: Description
            type: text
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: src/assets/book
              rename: safe
        view:
          fields: [title, template]
          primary: title
          sort: [title]
          search: [title, body]
          default:
            sort: title
            order: asc

      - name: chapters_en
        label: Chapters (English)
        type: collection
        path: src/content/book/en
        format: yaml-frontmatter
        filename:
          template: "{primary}.mdx"
          field: create
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Chapter title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: book_template
          - name: description
            label: Description
            type: text
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: src/assets/book
              rename: safe
        view:
          fields: [title, template]
          primary: title
          sort: [title]
          search: [title, body]
          default:
            sort: title
            order: asc

      - name: chapters_sl
        label: Chapters (Slovene)
        type: collection
        path: src/content/book/sl
        format: yaml-frontmatter
        filename:
          template: "{primary}.mdx"
          field: create
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Chapter title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: book_template
          - name: description
            label: Description
            type: text
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: src/assets/book
              rename: safe
        view:
          fields: [title, template]
          primary: title
          sort: [title]
          search: [title, body]
          default:
            sort: title
            order: asc

  - name: site_pages
    label: Site Pages
    type: group
    items:
      - name: home_de
        label: Home Page (German)
        type: file
        path: src/content/pages/de/index.mdx
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: page_template
          - name: openerImage
            label: Opener image
            type: image
            options:
              media: book_images
              path: src/assets/book
          - name: openerImageAlt
            label: Opener image alt text
            type: text
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: src/assets/site
              rename: safe

      - name: home_en
        label: Home Page (English)
        type: file
        path: src/content/pages/en/index.mdx
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: page_template
          - name: openerImage
            label: Opener image
            type: image
            options:
              media: book_images
              path: src/assets/book
          - name: openerImageAlt
            label: Opener image alt text
            type: text
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: src/assets/site
              rename: safe

      - name: home_sl
        label: Home Page (Slovene)
        type: file
        path: src/content/pages/sl/index.mdx
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: page_template
          - name: openerImage
            label: Opener image
            type: image
            options:
              media: book_images
              path: src/assets/book
          - name: openerImageAlt
            label: Opener image alt text
            type: text
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: src/assets/site
              rename: safe

  - name: metadata
    label: Metadata
    type: group
    items:
      - name: project_metadata
        label: Project Metadata
        type: file
        path: src/data/project.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: name
            label: Project name
            type: string
            required: true
          - name: description
            type: text
          - name: credit
            type: text

      - name: book_metadata
        label: Book Metadata
        type: file
        path: src/data/works.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: de
            label: German book metadata
            type: object
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: creator
                type: string
              - name: contributor
                type: string
              - name: description
                type: text
              - name: publisher
                type: string
              - name: rights
                type: text
              - name: language
                type: string
          - name: en
            label: English book metadata
            type: object
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: creator
                type: string
              - name: contributor
                type: string
              - name: description
                type: text
              - name: publisher
                type: string
              - name: rights
                type: text
              - name: language
                type: string
          - name: sl
            label: Slovene book metadata
            type: object
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: creator
                type: string
              - name: contributor
                type: string
              - name: description
                type: text
              - name: publisher
                type: string
              - name: rights
                type: text
              - name: language
                type: string

      - name: navigation
        label: Navigation
        type: file
        path: src/data/nav.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: de
            label: German navigation
            type: object
            list: true
            fields:
              - name: label
                type: string
                required: true
              - name: file
                type: string
                required: true
          - name: en
            label: English navigation
            type: object
            list: true
            fields:
              - name: label
                type: string
                required: true
              - name: file
                type: string
                required: true
          - name: sl
            label: Slovene navigation
            type: object
            list: true
            fields:
              - name: label
                type: string
                required: true
              - name: file
                type: string
                required: true
