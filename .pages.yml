# GENERATED from handbook.config.ts — do not edit by hand.
# Run `npm run sync:config` to regenerate.
media:
  - name: book_images
    label: Book images
    input: src/assets/book
    output: src/assets/book
    categories: [image]
    rename: safe
  - name: site_images
    label: Site images
    input: src/assets/site
    output: src/assets/site
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  markdown_body:
    label: Body
    type: code
    options:
      format: mdx
  book_template:
    label: Template
    type: select
    options:
      values:
        - name: chapter
          label: Chapter
        - name: cover
          label: Cover
        - name: title
          label: Title page
        - name: about
          label: About page
        - name: contents
          label: Contents page
  page_template:
    label: Template
    type: select
    options:
      values:
        - name: home
          label: Home
        - name: page
          label: Content page
        - name: search
          label: Search page
  language:
    label: Language
    type: select
    options:
      values:
        - name: de
          label: Deutsch
        - name: en
          label: English
        - name: sl
          label: Slovenščina

