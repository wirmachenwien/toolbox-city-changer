media:
  - name: book_images
    label: Book images
    input: book/images/web
    output: images/web
    categories: [image]
    rename: safe
  - name: site_images
    label: Site images
    input: assets/images/web
    output: assets/images/web
    categories: [image]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  markdown_body:
    label: Body
    type: rich-text
    options:
      format: markdown
      switcher: true
  page_style:
    label: Page style
    type: select
    options:
      values:
        - name: default-page
          label: Default page
        - name: default-page page-1
          label: First chapter page
        - name: chapter
          label: Chapter
        - name: home
          label: Home
        - name: cover-page
          label: Cover page
        - name: index
          label: Collection home page
        - name: cover
          label: Cover
        - name: halftitle-page
          label: Half-title page
        - name: title-page
          label: Title page
        - name: copyright-page
          label: Copyright page
        - name: contents-page
          label: Contents page
        - name: dedication-page
          label: Dedication page
        - name: epigraph-page
          label: Epigraph page
        - name: frontmatter
          label: Other frontmatter

content:
  - name: handbook
    label: Handbook
    type: group
    items:
      - name: chapters
        label: Chapters
        type: collection
        path: book
        format: yaml-frontmatter
        exclude:
          - index.md
          - 0-0-cover.md
          - 0-1-titlepage.md
          - 0-2-copyright.md
          - 0-3-contents.md
        filename:
          template: "{primary}.md"
          field: create
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Chapter title
            type: string
            required: true
          - name: style
            component: page_style
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: book/images/web
              rename: safe
        view:
          fields: [title, style]
          primary: title
          sort: [title]
          search: [title, body]
          default:
            sort: title
            order: asc

      - name: front_matter
        label: Front Matter
        type: collection
        path: book
        format: yaml-frontmatter
        exclude:
          - index.md
          - 01.md
          - 02.md
          - 03.md
          - 04.md
          - 05.md
          - 06.md
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: title
            label: Page title
            type: string
          - name: style
            component: page_style
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: book/images/web
              rename: safe
        view:
          fields: [title, style]
          primary: title
          sort: [title]
          search: [title, body]
          default:
            sort: title
            order: asc

      - name: book_cover_entry
        label: Book Cover Entry
        type: file
        path: book/index.md
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: style
            component: page_style
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: book/images/web
              rename: safe

  - name: site_pages
    label: Site Pages
    type: group
    items:
      - name: home
        label: Home Page
        type: file
        path: index.md
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: style
            component: page_style
          - name: opener-image
            label: Opener image filename
            type: string
            description: "Filename from assets/images/web, for example supergraetzel-favoriten-poller-opener.jpg."
          - name: opener-image-alt-text
            label: Opener image alt text
            type: text
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: assets/images/web
              rename: safe

      - name: about
        label: About Page
        type: file
        path: about.md
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: assets/images/web
              rename: safe

      - name: contact
        label: Contact Page
        type: file
        path: contact.md
        format: yaml-frontmatter
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: assets/images/web
              rename: safe

  - name: metadata
    label: Metadata
    type: group
    items:
      - name: project_metadata
        label: Project Metadata
        type: file
        path: _data/project.yml
        format: yaml
        operations:
          create: false
          delete: false
        fields:
          - name: organisation
            type: string
          - name: url
            label: Organisation URL
            type: string
          - name: email
            type: string
          - name: name
            label: Project name
            type: string
            required: true
          - name: description
            type: text
          - name: logo
            label: Logo filename
            type: string
          - name: image
            label: Project image filename
            type: string
          - name: credit
            type: text
          - name: language
            type: string
          - name: app-id
            label: App ID
            type: string
          - name: version
            type: string

      - name: book_metadata
        label: Book Metadata
        type: file
        path: _data/works/book/default.yml
        format: yaml
        operations:
          create: false
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: subtitle
            type: string
          - name: creator
            type: string
          - name: contributor
            type: string
          - name: description
            type: text
          - name: image
            label: Cover image filename
            type: string
          - name: publisher
            type: string
          - name: publisher-url
            label: Publisher URL
            type: string
          - name: rightsholder
            type: string
          - name: rights
            type: text
          - name: language
            type: string
          - name: date
            type: date
          - name: modified
            type: date
          - name: type
            label: Book type
            type: string
          - name: subject
            type: string
          - name: identifier
            type: string
          - name: source
            type: string
          - name: relation
            type: string
          - name: coverage
            type: string
          - name: keywords
            type: text

      - name: navigation
        label: Navigation
        type: file
        path: _data/nav.yml
        format: yaml
        operations:
          create: false
          delete: false
        fields:
          - name: de
            label: German navigation
            type: object
            list: true
            fields:
              - name: label
                type: string
                required: true
              - name: file
                type: string
                required: true
